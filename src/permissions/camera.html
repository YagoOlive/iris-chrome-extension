<!doctype html>
<title>Grant camera access</title>
<script type="module">
  (async () => {
    try {
      await navigator.mediaDevices.getUserMedia({ video: true }); // shows Chrome prompt
    } catch {
      /* do nothing if there are errors */
    } finally {
      // Tell the service-worker; sender.tab will let it close us
      chrome.runtime.sendMessage({ cmd: 'CAMERA_RESULT' });
    }
  })();
</script>
