name: Build & Publish Chrome-Extension Release

on:
  push:
    branches: [main] # create releases only from main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # allow tags & releases
    outputs:
      version:  ${{ steps.vars.outputs.version }}
      zip_name: ${{ steps.zip.outputs.name }}
      should_publish:  ${{ steps.vars.outputs.should_publish }}

    steps:
      # 1 — checkout with full history so tags work
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pull tags & previous commits

      # 2 — compute version delta & guard against existing releases
      - id: vars
        env:
          BEFORE:  ${{ github.event.before }}
          OWNER:   ${{ github.repository_owner }}
          PUBLIC:  head-tracking-pointer-public
          # tokens for gh cli (private uses GITHUB_TOKEN; public uses your PAT)
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          set -euo pipefail

          # Current version from working tree
          CURR="$(jq -r '.version // empty' manifest.json)"

          # Previous version from the commit before this push (may be empty on first push)
          PREV=""
          if git cat-file -e "$BEFORE:manifest.json" 2>/dev/null; then
            PREV="$(git show "$BEFORE:manifest.json" | jq -r '.version // empty')"
          fi

          echo "PREV: $PREV"
          echo "CURR: $CURR"

          # Default: do not publish
          SHOULD="false"

          if [ -n "$CURR" ] && [ "$CURR" != "$PREV" ]; then
            SHOULD="true"
            # hard guard: if tag/release already exists in private OR public, abort publish
            if gh release view "v$CURR" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              SHOULD="false"
              echo "Private release v$CURR already exists; skipping."
            elif [ -n "${PUBLIC_TOKEN:-}" ] && GH_TOKEN="$PUBLIC_TOKEN" gh release view "v$CURR" -R "$OWNER/$PUBLIC" >/dev/null 2>&1; then
              SHOULD="false"
              echo "Public release v$CURR already exists; skipping."
            fi
          fi

          echo "version=$CURR"           >> "$GITHUB_OUTPUT"
          echo "should_publish=$SHOULD"  >> "$GITHUB_OUTPUT"

      # 3 — stop early if not a release (keeps job green, sets output to '')
      - name: Skip job if not a release
        if: ${{ steps.vars.outputs.should_publish != 'true' }}
        run: echo "No version bump detected."

      # 4 — build
      - uses: actions/setup-node@v4
        if: ${{ steps.vars.outputs.should_publish == 'true' }}
        with:
          node-version: '20'
      - if: ${{ steps.vars.outputs.should_publish == 'true' }}
        run: |
          npm ci
          npm run build

      # 5 — zip ./dist
      - id: zip
        if: ${{ steps.vars.outputs.should_publish == 'true' }}
        run: |
          NAME="head-tracking-chrome-extension-v${{ steps.vars.outputs.version }}.zip"
          zip -r "$NAME" dist
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # 6 — create tag (idempotent)
      - name: Create git tag
        if: ${{ steps.vars.outputs.should_publish == 'true' }}
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists, continuing."
          else
            git tag -a "v$VERSION" -m "v$VERSION"
            git push origin "v$VERSION"
          fi

      # 7 — slice the CHANGELOG for this version
      - name: Generate release notes
        if: ${{ steps.vars.outputs.should_publish == 'true' }}
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          awk "/^## $VERSION /{flag=1;print;next}/^## /&&flag{exit}flag" CHANGELOG.md > release_notes.md

      # 8 — publish private repo Release
      - name: Publish GitHub Release
        if: ${{ steps.vars.outputs.should_publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name:  "v${{ steps.vars.outputs.version }}"
          name:      "v${{ steps.vars.outputs.version }}"
          body_path: release_notes.md
          files:     ${{ steps.zip.outputs.name }}

      # 9 — upload artifacts for downstream job
      - name: Upload release artifacts
        if: ${{ steps.vars.outputs.should_publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            ${{ steps.zip.outputs.name }}
            release_notes.md

  public-release:
    needs: release # waits for the build & private-release job
    if: ${{ needs.release.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1 — check out private repo to copy public-facing files
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2 — download the .zip and release_notes.md from the first job
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: ./artifacts

      # 3 — stage only the public files
      - name: Prepare export directory
        run: |
          mkdir -p export
          cp manifest.json README.md CHANGELOG.md export/
          cp -r public export/public

      # 4 — push them to the public repo (SSH deploy key)
      - name: Sync docs to public repo
        uses: cpina/github-action-push-to-another-repository@main
        with:
          source-directory: export
          destination-github-username: ${{ github.repository_owner }}
          destination-repository-name: head-tracking-pointer-public
          target-branch: main
          commit-message: "release: ${{ needs.release.outputs.version }}"
          user-name:  ${{ github.repository_owner }}
          user-email: "${{ github.event.sender.id }}+${{ github.repository_owner }}@users.noreply.github.com"
        env:
          SSH_DEPLOY_KEY: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}

      # 5 — create the public Release with the ZIP
      - name: Publish release in public repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository_owner }}/head-tracking-pointer-public
          tag_name: "v${{ needs.release.outputs.version }}"
          name: "v${{ needs.release.outputs.version }}"
          body_path: ./artifacts/release_notes.md
          files: "./artifacts/head-tracking-chrome-extension-v${{ needs.release.outputs.version }}.zip"
          token: ${{ secrets.PUBLIC_REPO_PAT }}
